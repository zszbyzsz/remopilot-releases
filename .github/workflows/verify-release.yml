name: Verify release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify
        required: true
        default: v1.3.8
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Download and check signed archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/package"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" --pattern "remopilot-*-$RELEASE_TARGET.tar.gz*"
          cd "$RUNNER_TEMP/release"
          if [ "$RUNNER_OS" = macOS ]; then shasum -a 256 -c ./*.sha256; else sha256sum -c ./*.sha256; fi
          tar -xzf ./*.tar.gz -C "$RUNNER_TEMP/package"
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --verify --strict --verbose=2 "$RUNNER_TEMP/package/remopilot"
            codesign --verify --strict --verbose=2 "$RUNNER_TEMP/package/remopilot-desktop"
            spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/package/remopilot"
            spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/package/remopilot-desktop"
          fi
      - name: Verify activation and independence from the candidate package
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/package"
          runtime="$RUNNER_TEMP/activated-runtime"
          "$package/remopilot" version
          "$package/remopilot" homebrew --action install --package "$package" --prefix "$runtime" > "$RUNNER_TEMP/activation.json"
          cat "$RUNNER_TEMP/activation.json"
          "$runtime/bin/remopilot" version
          "$package/remopilot" homebrew --action install --package "$package" --prefix "$runtime" > "$RUNNER_TEMP/reactivation.json"
          rm -rf "$package"
          "$runtime/bin/remopilot" version
          test -d "$runtime/homebrew/packages"
